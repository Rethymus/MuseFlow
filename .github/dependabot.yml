version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # 次要/补丁版本合并为一个 PR，大版本（major）单独开 PR 以便专门评估迁移成本
    groups:
      pub-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Actions 升级风险低，全部版本合并为一个 PR
    groups:
      actions-all:
        update-types:
          - "major"
          - "minor"
          - "patch"
